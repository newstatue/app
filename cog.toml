tag_prefix = "v"
from_latest_tag = true
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
branch_whitelist = []
pre = "alpha.*"
skip_ci = "[skip ci]"
skip_untracked = false
pre_bump_hooks = [
    "cargo set-version --manifest-path src-tauri/Cargo.toml {{version}}",
    "npm version {{version}} --no-git-tag-version",
    "git add src-tauri/Cargo.toml src-tauri/Cargo.lock package.json"
]
post_bump_hooks = []
pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]
[git_hooks.pre-commit]
script = """#!/bin/sh
set -eu

# 检查暂存文件是否还存在未暂存的修改
if git status --short | grep -q '^MM'; then
    echo "ERROR: Some staged files have unstaged changes" >&2
    exit 1
fi

# 格式化暂存文件、整理导入、应用安全修复
bunx biome check --write --staged --files-ignore-unknown=true --no-errors-on-unmatched

# 重新暂存格式化后的内容
git update-index --again
"""

[commit_types]
feat = { changelog_title = "新功能 / Features" }
fix = { changelog_title = "问题修复 / Bug Fixes" }
chore = { changelog_title = "日常维护 / Maintenance" }
docs = { changelog_title = "文档更新 / Documentation" }
refactor = { changelog_title = "代码重构 / Refactoring" }
perf = { changelog_title = "性能优化 / Performance" }
build = { changelog_title = "构建系统 / Build" }
ci = { changelog_title = "持续集成 / CI" }
test = { changelog_title = "测试 / Tests" }
style = { changelog_title = "代码格式 / Styling" }
revert = { changelog_title = "撤销变更 / Reverts" }

[changelog]
path = "CHANGELOG.md"
template = "changelog.tera"
authors = []

[bump_profiles]
